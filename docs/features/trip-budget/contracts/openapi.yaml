openapi: 3.1.0
info:
  title: trip-ledger — trip-budget API
  version: 0.1.0
  contact:
    name: trip-ledger (pet project)
    url: https://github.com/mckey/trip-ledger
  description: |
    Зовнішній контракт фічі trip-budget. Стадія API contracts, перегенеровано
    `contract-forge --update` (мій форк `sdlc:api-forge`) — реконсиляція з
    живим дротом і з контрактом multi-currency-summary на ті самі ендпойнти
    (api-sync-report.md, F1/F2).

    Навіщо цей API (idea-brief §13, Approach A): у поїздки з'являється планова
    стеля витрат однією сумою в base currency; залишок (remaining) і лічильник
    неврахованих витрат живуть у підсумку, а overspend signal приходить прямо
    у відповіді на додавання витрати — щоб перевитрату було видно в поїздці,
    а не вдома постфактум (PRD §1).

    ## Scope

    - `PUT /trips/{tripId}/budget` — NEW (US-01, US-05, US-06).
    - `POST /trips/{tripId}/expenses` — CHANGED: відповідь стає envelope
      `{expense, budget}` (ADR-0003). Єдиний breaking data-shape change проти
      as-built дроту.
    - `GET /trips/{tripId}/summary` — CHANGED: відповідь з масиву стає
      об'єктом `{lines, budget}` (ADR-0002). Другий і останній прийнятий
      breaking data-shape change.

    Інші ендпойнти trip-ledger у цей контракт не входять — фіча їх не чіпає.

    ## Sources of truth

    PRD.md (§4 US, §5 AC, §6.1) · data-model.md (`trips`, `expenses`) ·
    sad.md §5 Building blocks, §6 (flows 1–3 + cross-cutting AC-08), §8 ·
    adr/0001–0004 · idea-brief.md · живі `tripsRouter.ts` / `expensesRouter.ts` ·
    сусідній контракт `../../multi-currency-summary/contracts/openapi.yaml`
    (спільні ендпойнти `addExpense`, `getTripSummary` — той самий регістр,
    ті самі шляхи, форма помилок і auth). Походження кожного поля —
    `api-sync-report.md` поруч.

    ## Conventions

    `.claude/rules/openapi.md` (baseline `contract-forge`): camelCase — як
    живий дріт і TS-домен; шляхи без версії в URL (версія — `info.version`);
    value objects `Money` / `Balance` своїми полями (`{amount, currency}`),
    не розкладені на `*_minor` колонки; помилки `{code, message, details?}`
    з `code = <bc>.<snake(Sentinel)>`; `ApiKeyAuth` (`X-API-Key`).

    Це — заміна попереднього прогону готовим `api-forge`, який застосував
    дефолти курсу (snake_case, `/api/v1`, `{code, message}` з `BearerAuth`)
    до API, що живе на camelCase без версії і без auth-схеми (плановано).
    Відхилення від дефолтів `.claude/rules/openapi.md` — нижче в `Conventions`
    самого правила; розбіжності з попереднім прогоном — у api-sync-report.md
    («Wire diff проти попереднього контракту»).

servers:
  - url: http://localhost:3000
    description: Local (single-user, слухає лише 127.0.0.1 — sad.md §8)

security:
  - ApiKeyAuth: []

tags:
  - name: budget
    description: Budget поїздки (BC trips)
  - name: expenses
    description: Витрати й підсумок поїздки (BC expenses)

paths:
  /trips/{tripId}/budget:
    parameters:
      - $ref: "#/components/parameters/TripId"
    put:
      tags: [budget]
      summary: Задати або замінити budget поїздки
      description: |
        Перше задання фіксує base currency поїздки; заміна можлива лише в тій
        самій валюті (AC-02). Значення перезаписується без журналу (AC-07).
        Дозволено в будь-якому статусі поїздки, включно з `finished` (AC-09).
        PUT ідемпотентний за семантикою — `Idempotency-Key` не потрібен.
        Ендпойнт NEW — живого дроту немає, форма визначена цим контрактом.
      operationId: setTripBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBudgetRequest"
            example:
              amount: 5000000
              baseCurrency: EUR
      responses:
        "200":
          description: Budget збережено; підсумок відтепер показує блок залишку (AC-01).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripBudget"
              example:
                tripId: 00000000-0000-4000-8000-000000000001
                budget:
                  amount: 5000000
                  currency: EUR
                budgetSetAt: "2026-10-01T08:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TripDoesNotExist"
        "422":
          $ref: "#/components/responses/BudgetRejected"

  /trips/{tripId}/expenses:
    parameters:
      - $ref: "#/components/parameters/TripId"
    post:
      tags: [expenses]
      summary: Додати витрату й отримати overspend signal
      description: |
        Витрата приймається завжди, навіть якщо перевищує budget — budget
        ніколи не блокує (CONTEXT Invariants, AC-04). Overspend — не помилка,
        а `budget.overspend: true` у тілі відповіді 201 (ADR-0003).
        `budget: null`, якщо budget поїздки не задано. Спільний ендпойнт з
        multi-currency-summary — там же `rate` (ще не в scope цієї фічі).
      operationId: addExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExpenseRequest"
            example:
              amount: 4500
              currency: EUR
              category: food
              spentAt: "2026-10-03"
      responses:
        "201":
          description: Витрату прийнято; блок budget обчислено тією ж BudgetBlock, що й у підсумку.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddExpenseResponse"
              examples:
                overspend:
                  summary: Budget перевищено — сигнал у тій самій відповіді
                  value:
                    expense:
                      id: 00000000-0000-4000-8000-0000000000e1
                      tripId: 00000000-0000-4000-8000-000000000001
                      amount: { amount: 4500, currency: EUR }
                      category: food
                      spentAt: "2026-10-03T00:00:00.000Z"
                    budget:
                      budget: { amount: 100000, currency: EUR }
                      remaining: { amount: -2500, currency: EUR }
                      counted: 7
                      uncounted: 2
                      overspend: true
                no_budget:
                  summary: Budget не задано
                  value:
                    expense:
                      id: 00000000-0000-4000-8000-0000000000e2
                      tripId: 00000000-0000-4000-8000-000000000002
                      amount: { amount: 1200, currency: UAH }
                      category: transport
                      spentAt: "2026-10-04T00:00:00.000Z"
                    budget: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ExpenseTripNotFound"
        "409":
          $ref: "#/components/responses/TripNotAcceptingExpenses"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /trips/{tripId}/summary:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      tags: [expenses]
      summary: Підсумок поїздки з блоком залишку
      description: |
        `lines` — агрегат по (категорія, валюта), як і раніше (as-built форма
        збережена 1:1). `budget` — той самий блок, що у відповіді додавання
        витрати, або `null`, якщо budget не задано. Від'ємний `remaining`
        показується від'ємним (AC-03b); якщо всі витрати чужовалютні —
        `remaining` дорівнює повному budget, а `uncounted` — кількості всіх
        витрат (AC-06b). Спільний ендпойнт з multi-currency-summary — там же
        `converted` (ще не в scope цієї фічі).
      operationId: getTripSummary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSummary"
              example:
                lines:
                  - category: food
                    currency: EUR
                    total: { amount: 102500, currency: EUR }
                  - category: transport
                    currency: UAH
                    total: { amount: 340000, currency: UAH }
                budget:
                  budget: { amount: 100000, currency: EUR }
                  remaining: { amount: -2500, currency: EUR }
                  counted: 7
                  uncounted: 2
                  overspend: true
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Owner-ключ з `API_KEY` (sad.md §8; ім'я заголовка — дефолт `.claude/rules/openapi.md`, узгоджено з multi-currency-summary). Перевіряється до будь-якого читання сховища (AC-08); 401 однаковий для наявного й неіснуючого ресурсу.

  parameters:
    TripId:
      in: path
      name: tripId
      required: true
      description: Id поїздки — legacy `trips.id TEXT` з `randomUUID()` (v4).
      schema:
        type: string
        format: uuid

  schemas:
    CurrencyCode:
      type: string
      description: Код ISO 4217 у верхньому регістрі (sad.md §8; повного довідника у v1 немає — патерн).
      pattern: "^[A-Z]{3}$"
      minLength: 3
      maxLength: 3
      examples: [EUR]

    Money:
      type: object
      additionalProperties: false
      description: "`shared/Money` — ціле невід'ємне в minor units + валюта. Буває сумою (підсумки), тож межа — JS safe integer."
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          $ref: "#/components/schemas/CurrencyCode"

    Balance:
      type: object
      additionalProperties: false
      description: "`shared/Balance` (ADR-0004) — знакове ціле в minor units + валюта."
      required: [amount, currency]
      properties:
        amount:
          type: integer
        currency:
          $ref: "#/components/schemas/CurrencyCode"

    ExpenseCategory:
      type: string
      enum: [transport, lodging, food, tickets, other]

    SetBudgetRequest:
      type: object
      additionalProperties: false
      required: [amount, baseCurrency]
      properties:
        amount:
          type: integer
          description: Додатна сума budget у мінорних одиницях (AC-02 — нуль і від'ємні відхиляються; zod `int().positive()`, sad.md §8). Флет-поле, як `AddExpenseRequest.amount` — не `Money` (той дозволяє 0).
          minimum: 1
          maximum: 2147483647
        baseCurrency:
          $ref: "#/components/schemas/CurrencyCode"

    TripBudget:
      type: object
      additionalProperties: false
      description: Поїздка після задання/заміни budget (ADR-0001). Валюта живе всередині `budget.currency` — окремого поля `baseCurrency` тут немає (той самий принцип, що й у `BudgetBlock`).
      required: [tripId, budget, budgetSetAt]
      properties:
        tripId:
          type: string
          format: uuid
        budget:
          $ref: "#/components/schemas/Money"
        budgetSetAt:
          # unused-in-prd: trips.budget_set_at є в data-model.md, story в PRD немає.
          # Рішення owner-а (api-sync-report F7, run 2): лишити, ретроспектива US-06.
          type: string
          format: date-time
          description: Коли budget востаннє задано або замінено (`trips.budget_set_at`). Не журнал — одне значення (PRD §3).

    AddExpenseRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, category, spentAt]
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Minor units (as-built поле; `expenses.amount_minor INTEGER`).
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        spentAt:
          type: string
          format: date

    Expense:
      type: object
      additionalProperties: false
      required: [id, tripId, amount, category, spentAt]
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        spentAt:
          type: string
          format: date-time
          description: As-built — `Date` серіалізується як ISO date-time, хоча в БД `DATE` (той самий факт документує multi-currency-summary F5 — спільний код, не нова розбіжність).

    BudgetBlock:
      type: object
      additionalProperties: false
      description: Результат чистої функції BudgetBlock (ADR-0002) — одна форма у двох відповідях (ADR-0003). Форма ідентична `BudgetBlock` у контракті multi-currency-summary (яка розширює семантику `counted`, тут — базова, ADR-0002).
      required: [budget, remaining, counted, uncounted, overspend]
      properties:
        budget:
          $ref: "#/components/schemas/Money"
        remaining:
          allOf:
            - $ref: "#/components/schemas/Balance"
          description: budget − Σ counted; може бути від'ємним (Balance, ADR-0004; AC-03b).
        counted:
          type: integer
          minimum: 0
          description: Кількість витрат у base currency, що увійшли в порівняння.
        uncounted:
          type: integer
          minimum: 0
          description: Кількість витрат в інших валютах — у порівняння не увійшли (AC-06, AC-06b).
        overspend:
          type: boolean
          description: "`true`, якщо `remaining.amount < 0`. Сигнал, не заборона."

    AddExpenseResponse:
      type: object
      additionalProperties: false
      required: [expense, budget]
      properties:
        expense:
          $ref: "#/components/schemas/Expense"
        budget:
          oneOf:
            - $ref: "#/components/schemas/BudgetBlock"
            - type: "null"

    SummaryLine:
      type: object
      additionalProperties: false
      description: As-built `TripSummaryLine` — сирі суми без перерахунку, форма 1:1 з живим дротом.
      required: [category, currency, total]
      properties:
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        total:
          $ref: "#/components/schemas/Money"

    TripSummary:
      type: object
      additionalProperties: false
      required: [lines, budget]
      properties:
        lines:
          type: array
          description: Агрегат по (категорія, валюта) — не колекція сутностей, без пагінації (`.claude/rules/openapi.md` «Колекції»).
          items:
            $ref: "#/components/schemas/SummaryLine"
        budget:
          oneOf:
            - $ref: "#/components/schemas/BudgetBlock"
            - type: "null"

    ValidationIssue:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
          description: Шлях до поля в тілі запиту, через крапку (`amount`, `baseCurrency`).
        message:
          type: string

    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: "`<bc>.<snake(Sentinel)>`, bc ∈ trips | expenses | shared | http."
          pattern: "^(trips|expenses|shared|http)\\.[a-z][a-z0-9_]*$"
          examples: [expenses.trip_not_found]
        message:
          type: string
        details:
          $ref: "#/components/schemas/ErrorDetails"

  responses:
    Unauthorized:
      description: |
        Ключа немає або він не збігається. Відповідь однакова для наявної і
        неіснуючої поїздки — сховище не зачеплено (AC-08, sad.md §6 cross-cutting).
        Той самий код і форма, що в multi-currency-summary.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: http.unauthorized
            message: Unauthorized

    ValidationFailed:
      description: Тіло запиту не пройшло zod-валідацію.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: http.validation_failed
            message: Request body is invalid
            details:
              issues:
                - path: currency
                  message: must match ^[A-Z]{3}$

    ExpenseTripNotFound:
      description: "`TripNotFoundError` (BC expenses, `src/expenses/domain/errors.ts`) — поїздки немає (as-built). Той самий код, що в multi-currency-summary."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: expenses.trip_not_found
            message: Trip not found

    TripNotAcceptingExpenses:
      description: "`TripNotAcceptingExpensesError` (BC expenses) — поїздка finished, витрати не приймаються (CONTEXT Invariants). Той самий код, що в multi-currency-summary."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: expenses.trip_not_accepting_expenses
            message: Trip is not accepting expenses

    TripDoesNotExist:
      description: "`TripDoesNotExistError` (BC trips, sad.md §5 — planned, ще не в коді) — поїздки немає. Той самий код, що в multi-currency-summary (яка теж посилається на цей sentinel)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: trips.trip_does_not_exist
            message: Trip not found

    BudgetRejected:
      description: |
        Два коди з одним статусом 422: невалідна форма (`http.validation_failed`)
        або валюта не збігається з уже зафіксованою base currency поїздки
        (`trips.budget_currency_mismatch`, `BudgetCurrencyMismatchError` — planned,
        sad.md §5) — AC-02.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalid_payload:
              value:
                code: http.validation_failed
                message: Request body is invalid
                details:
                  issues:
                    - path: amount
                      message: must be >= 1
            currency_mismatch:
              value:
                code: trips.budget_currency_mismatch
                message: Trip base currency is EUR, cannot set budget in USD
